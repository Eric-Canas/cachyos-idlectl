[workspace]
resolver = "3"
members = [
    "crates/idlectl-policy",
    "crates/idlectl-config",
    "crates/idlepolicyd",
    "crates/idlectl-agent",
    "crates/idlectl",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
# MSRV. Driven by zbus 5.x, which declares rust-version = "1.87" and edition 2024.
#
# There is deliberately NO rust-toolchain.toml in this repository. Pinning an exact
# toolchain file makes no sense for a rolling distribution target: the packager builds
# with whatever `rust` is in the repo that day, and a pin would either be ignored (if
# rustup is absent) or would try to download a second toolchain inside a build chroot.
# `rust-version` is the correct mechanism: it states a floor and fails the build with a
# clear message instead of a wall of type errors.
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/Eric-Canas/cachyos-idlectl"
homepage = "https://github.com/Eric-Canas/cachyos-idlectl"
keywords = ["idle", "power", "suspend", "systemd", "dbus"]
categories = ["command-line-utilities", "os::linux-apis"]

[workspace.dependencies]
# --- workspace-internal ---------------------------------------------------------
idlectl-policy = { path = "crates/idlectl-policy", version = "0.4.0" }
idlectl-config = { path = "crates/idlectl-config", version = "0.4.0" }

# --- pure data ------------------------------------------------------------------
# serde and toml perform no I/O whatsoever: they turn &str into structs. They are the
# only dependencies the two pure crates are allowed to carry.
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"

# --- runtime (binaries only) -----------------------------------------------------
# zbus's default features are ["async-io", "blocking-api"].
#
#   * async-io  -- REQUIRED. zbus 5.18 has a compile_error! in lib.rs that fires unless
#                  exactly one of `async-io` or `tokio` is enabled; `blocking-api` alone
#                  does not provide a transport, it only expands to zbus_macros/blocking-api.
#   * tokio     -- MUST NEVER be enabled, anywhere in the tree. This project runs one
#                  reactor. async-io already drives the D-Bus socket, inotify, the udev
#                  netlink socket and every timer; a second scheduler would mean two
#                  places that can block the decision loop. `cargo deny` enforces this
#                  (see deny.toml [bans]); the pin below is the first line of defence.
#   * blocking-api -- switched off. Every call site here is async.
zbus = { version = "5.18.0", default-features = false, features = ["async-io"] }
async-io = "2.6.0"
async-executor = "1.14.0"
futures-lite = "2.6.1"
# The rest of the smol family, for the same reason as async-io: they ARE async-io, so
# they add no second reactor. async-process is here because `nvidia-smi` is a fork+exec
# that takes ~100 ms, and doing that synchronously would stall the reactor that owns the
# machine's power decision; async-net is here because the counters endpoint of [FACT-30]
# is an HTTP GET and a blocking read on a wedged local service would do the same.
async-net = "2.0.0"
async-process = "2.5.0"
async-lock = "3.4.1"
async-channel = "2.5.0"
# Raw syscalls without `unsafe` in this tree: CLOCK_BOOTTIME and a boottime timerfd.
# Every crate here sets #![forbid(unsafe_code)], which is only meaningful if the libc
# calls go through something that upholds the invariants itself.
rustix = { version = "1.1.4", features = ["time", "fs", "pipe", "event", "process", "system"] }
clap = { version = "4.6.4", features = ["derive"] }

# --- session agent only ----------------------------------------------------------
# These never reach idlepolicyd. The privileged half of this project links no display
# protocol at all: it decides, and the unprivileged agent inside the session performs.
#
# These link NO C library. wayland-backend ships two implementations and only the
# `client_system` one binds libwayland-client; nothing here, and nothing in the protocol
# crates' `client` features, turns it on, so the pure-Rust backend is what gets compiled.
# Measured on the packaged binary rather than argued from the feature graph: `ldd
# idlectl-agent` lists libc, libgcc_s and the vdso and nothing else, and the string
# "libwayland" does not appear in the binary at all, which also rules out a dlopen.
#
# Worth stating because it is the opposite of what comparable agents do -- swayidle and
# hypridle both link libwayland-client -- and because the packaging depends on it: an
# `ldd`-clean agent is why the distribution package needs no `wayland` dependency.
#
# idlepolicyd -- the half that can turn a machine off -- carries none of these at all and
# runs on a machine with no display stack.
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# KDE's own protocols. Needed, not optional: KWin implements ext-idle-notify-v1 but NOT
# wlr-output-power-management, so without this screen_off is unavailable on Plasma --
# which is CachyOS's flagship desktop and the single most likely place this runs.
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.13.2", features = ["screensaver", "dpms"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
serde_json = "1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
# `strip` is deliberately NOT set: distribution packaging decides whether to strip and
# whether to split out a debug package. Overriding it here would fight makepkg.
