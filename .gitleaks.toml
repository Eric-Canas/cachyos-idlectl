# ---------------------------------------------------------------------------
# idlectl -- gitleaks ruleset (tier 1)
#
# TWO-TIER LEAK PREVENTION
#
#   tier 1 (this file)  SHAPES.  Published, world-readable, and therefore it
#                       contains NO real identifier of any kind -- only the
#                       *classes* of identifier that must never reach this
#                       repository.  Runs in CI on pull requests and over the
#                       full history.
#
#   tier 2              LITERALS.  Real host names, addresses, MACs and account
#                       names, kept in a file OUTSIDE the repository
#                       (~/.config/idlectl/forbidden-literals.txt) and read by
#                       scripts/check-forbidden-literals.sh.  Never published,
#                       never echoed, not even in a failure message.
#
# Adding a real value to THIS file would publish the very string it is meant to
# protect.  If you catch yourself typing one, it belongs in tier 2.
#
# Approved placeholders, for reference:
#   addresses   192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24  (RFC 5737)
#   IPv6        2001:db8::/32                                  (RFC 3849)
#   MAC         00:00:5E:00:53:xx                              (RFC 7042)
#   hosts       example.com / example.org / *.invalid          (RFC 2606)
#   accounts    <user>, %i, ${USER}
#
# Regex engine is Go RE2: no look-around, no back-references.
# ---------------------------------------------------------------------------

title = "idlectl publication guard"

# DO NOT set this to true.  Extending gitleaks' default configuration also
# imports its default GLOBAL allowlist, and that allowlist carries a stopword
# list containing the word "home" -- which silently drops every finding whose
# secret text contains it.  Measured with gitleaks 8.28.0 against a bait file:
# with useDefault = true, `/home/someguy/projects`, `/home/zzzqqq`, `/home/bob`
# and `/home/x` produce NO finding at all, while `/Users/zzzqqq` fires
# normally; with the inheritance switched off, every one of them fires.  So the
# single most likely leak shape for a Linux daemon extracted from one machine's
# notes -- an absolute home directory naming a real account -- was being
# discarded by a rule that reads correct and reports clean.
#
# gitleaks offers no way to clear an inherited global allowlist, so refusing
# the inheritance is the only reliable fix.  Nothing is lost: the imported
# rules are API and cloud-credential detectors that have no bearing on this
# repository, and private key material is already covered by the
# detect-private-key pre-commit hook and by the idlectl-ssh-key-material-
# reference rule below.
[extend]
useDefault = false

[allowlist]
description = """
Two exemptions, and only two.

This configuration file is one long list of identifier shapes, so scanning it
with its own rules produces nothing but self-matches.

.git/ is excluded because the WORKING-TREE scan is invoked as
`gitleaks detect --no-git --source .`, which is a plain directory walk and
therefore descends into git's own object store: the pack file, the index, the
reflog.  Findings there are unactionable by construction -- "line 3 of a
compressed pack" is not a location anyone can edit -- and they are noise
rather than signal, because everything inside .git/ is already covered by a
purpose-built check that reads it correctly rather than as bytes: the history
scan (`gitleaks detect --source . --log-opts=--all`) for commit content,
scripts/check-forbidden-literals.sh --objects for blobs orphaned by an amend,
scripts/check-commit-identity.sh for the identities in the reflog, and
preflight step 17 for the remote URL in .git/config.  This exemption does not
apply to the history scan, where paths are repository-relative and never begin
with .git/.
"""
paths = [
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)\.git/''',
  # Cargo's build directory. Same reason as .git/: the working-tree scan is a
  # plain directory walk that does not read .gitignore, so it descends into
  # target/ and reads every compiled artifact and vendored source as text.
  # Measured on this repository: 544 MB scanned, 888,716 "findings", none of
  # them from a file that can ever be published -- target/ is gitignored and
  # regenerated by every build. A scan whose output is a million lines is a
  # scan nobody reads, which is the same failure as a rule that never fires.
  #
  # Deliberately narrow. This exempts a PATH that cannot reach the repository,
  # not a rule and not a value; nothing here can mask a leak in a file that
  # would actually be committed.
  '''(^|/)target/''',
]

# ---------------------------------------------------------------------------
# Network identifiers
# ---------------------------------------------------------------------------

[[rules]]
id = "idlectl-private-ipv4-rfc1918"
description = "RFC 1918 private address (10/8, 172.16/12, 192.168/16) -- names a real LAN"
regex = '''\b(?:10\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|172\.(?:1[6-9]|2\d|3[01])\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|192\.168\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d))\b'''
tags = ["idlectl", "privacy", "network"]

[[rules]]
id = "idlectl-cgnat-ipv4"
description = "100.64.0.0/10 shared address space -- the range mesh VPNs hand out"
regex = '''\b100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\b'''
tags = ["idlectl", "privacy", "network"]

[[rules]]
id = "idlectl-ipv6-unique-local"
description = "fc00::/7 unique-local IPv6 address -- names a real LAN"
regex = '''(?i)\bf[cd][0-9a-f]{2}:(?:[0-9a-f]{0,4}:){1,6}[0-9a-f]{1,4}\b'''
tags = ["idlectl", "privacy", "network"]

[[rules]]
id = "idlectl-mac-address"
description = "MAC address shape -- a globally unique hardware identifier"
regex = '''(?i)\b(?:[0-9a-f]{2}[:-]){5}[0-9a-f]{2}\b'''
tags = ["idlectl", "privacy", "hardware"]
[rules.allowlist]
description = "documentation MAC ranges and the universally obvious placeholder"
regexes = [
  '''(?i)^00[:-]00[:-]5e[:-]00[:-]53[:-][0-9a-f]{2}$''',
  '''(?i)^aa[:-]bb[:-]cc[:-]dd[:-]ee[:-]ff$''',
  '''(?i)^(?:xx[:-]){5}xx$''',
]

[[rules]]
id = "idlectl-private-hostname-suffix"
description = "host name in a private DNS zone (.lan / .local / .internal / mesh VPN)"
# The middle group admits dots so that a multi-label name matches through to
# its suffix (a mesh-VPN name is host.tailnet.ts.net, not host.ts.net).
regex = '''(?im)(?:^|[\s"'`=@(\[<,;])[a-z0-9](?:[a-z0-9.-]{0,61}[a-z0-9])?\.(?:lan|local|internal|intranet|localdomain|home|home\.arpa|ts\.net)\b'''
tags = ["idlectl", "privacy", "network"]
[rules.allowlist]
description = "Rust/shell field access that happens to end in .local, and shape-only source files"
regexTarget = "line"
regexes = [
  '''(?i)\b(?:self|this|std|core|crate|super|thread|task|state|ctx|cfg|conf|config|node|now|time|clock|dt|date|tz|tm|opts|args)\.local\b''',
]
paths = [
  '''(^|/)scripts/check-commit-identity\.sh$''',
  '''(^|/)scripts/preflight-publish\.sh$''',
]

[[rules]]
id = "idlectl-bare-user-at-host"
description = "user@host with an unqualified host name -- an SSH target on someone's LAN"
regex = '''(?i)\b[a-z_][a-z0-9._-]{0,31}@[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:[^.0-9a-z_-]|$)'''
tags = ["idlectl", "privacy", "network"]
[rules.allowlist]
description = "package version pins and mail addresses that are already public"
regexTarget = "line"
regexes = [
  '''(?i)\bcargo\s+(?:add|install|update|yank)\b''',
  '''(?i)@(?:example\.(?:com|org|net)|users\.noreply\.github\.com|localhost|invalid)\b''',
  # "owner/action@v4" in a workflow, and version pins in general: the shape is
  # identical to account@host and the meaning could not be more different.
  '''(?i)^\s*-?\s*uses:\s''',
  '''(?i)@v[0-9]''',
]
paths = [
  # The scanners have to spell "account@host" out in order to describe what
  # they reject, exactly as the other rules already concede for these files.
  '''(^|/)scripts/check-commit-identity\.sh$''',
  '''(^|/)scripts/preflight-publish\.sh$''',
]

[[rules]]
id = "idlectl-remote-shell-invocation"
description = "an ssh/scp/rsync command line -- carries a real account and host"
# The optional flag group has to admit a BARE flag as well as a flag with an
# argument.  The obvious form, (?:-[a-zA-Z]+\s+\S+\s+)*, demands whitespace
# after the flag's argument, so `rsync -av someguy@host:/vol/` matches at
# neither zero nor one repetition -- the target IS the token that would have
# been the flag's argument.  Making the argument optional, and admitting long
# `--flag=value` forms, covers `ssh -p 22 u@h`, `ssh -i key u@h`, `rsync -av
# u@h:/p` and `rsync --archive u@h:/p` alike.
regex = '''(?i)\b(?:ssh|scp|sftp|rsync|mosh)\s+(?:-{1,2}[a-zA-Z-]+(?:[= ]\S+)?\s+)*[a-z_][a-z0-9._-]{0,31}@'''
tags = ["idlectl", "privacy", "network"]
[rules.allowlist]
description = "the scanner that must spell this command shape out in order to reject it"
paths = [
  '''(^|/)scripts/preflight-publish\.sh$''',
]

# ---------------------------------------------------------------------------
# Account and filesystem identifiers
# ---------------------------------------------------------------------------

[[rules]]
id = "idlectl-home-directory-path"
description = "an absolute home directory that names a real account"
regex = '''(?i)/(?:home|Users)/[a-z_][a-z0-9._-]{0,31}'''
tags = ["idlectl", "privacy", "account"]
[rules.allowlist]
description = "obviously generic placeholders and shell/systemd expansions"
regexes = [
  '''(?i)^/(?:home|users)/(?:user|username|youruser|someuser|someone|placeholder|example|test|builder|runner)$''',
  '''(?i)^/(?:home|users)/(?:\$\{?[a-z_]+\}?|%[a-z])''',
]

[[rules]]
id = "idlectl-ssh-key-material-reference"
description = "an SSH key file name or ~/.ssh path -- a power daemon has no business naming one"
regex = '''(?i)(?:\.ssh/[a-z0-9._-]+|\bid_(?:ed25519|rsa|ecdsa|dsa)(?:_sk)?(?:\.pub)?\b|\b[a-z0-9][a-z0-9.-]*_(?:ed25519|rsa|ecdsa|dsa)(?:_sk)?(?:\.pub)?\b|\bssh-(?:rsa|ed25519|dss)\s+AAAA)'''
tags = ["idlectl", "privacy", "credential"]
[rules.allowlist]
paths = [
  '''(^|/)scripts/check-tracked-paths\.sh$''',
  '''(^|/)scripts/preflight-publish\.sh$''',
]

# ---------------------------------------------------------------------------
# Language: this repository is ENGLISH ONLY.  The design notes it was extracted
# from are in Spanish, so any Spanish text is a leak of the private source, not
# a style problem.
# ---------------------------------------------------------------------------

[[rules]]
id = "idlectl-non-ascii-latin-orthography"
description = "Latin-1/Latin-Extended letter or inverted punctuation -- imported non-English prose"
# Written as hex escapes so that this file itself stays pure ASCII.
#
# Note what is NOT here: em dashes, arrows and curly quotes (U+2000 block).
# Those are typography, not language, and failing a leak scan over punctuation
# is how a leak scan gets switched off.  scripts/preflight-publish.sh reports
# them as an advisory instead.
#
# The two gaps in the range are U+00D7 and U+00F7, the multiplication and
# division signs.  They sit in the middle of the Latin block but they are
# arithmetic, and a spec that writes "8 x 3" with the real sign is not a leak.
regex = '''[\x{00a1}\x{00bf}\x{00c0}-\x{00d6}\x{00d8}-\x{00f6}\x{00f8}-\x{024f}]'''
tags = ["idlectl", "privacy", "language"]
[rules.allowlist]
description = """
A copyright line carries a legal name and must spell it correctly; that is the
one place in the tree where a non-ASCII letter is the right answer.

.pre-commit-config.yaml is here for the shape-file reason, not the legal one:
it configures the pygrep hook that enforces this same rule locally, so it has
to name the code-point range it forbids.  Writing the range as \\uXXXX escapes
used to keep the file pure ASCII and out of this rule's way, and that trick no
longer works -- gitleaks 8.28+ decodes unicode escapes before matching and
tags the result decoded:unicode, so the escaped form now matches exactly as
the literal form would.  Exempting the file is the honest answer; the hook it
configures still applies the rule to every other file.
"""
paths = [
  '''(^|/)(LICEN[CS]E|COPYING)(\..*)?$''',
  '''^LICENSES/''',
  '''(^|/)\.pre-commit-config\.yaml$''',
]

[[rules]]
id = "idlectl-spanish-vocabulary"
description = "Spanish keyword in an English-only repository -- imported private notes"
regex = '''(?i)\b(?:apagar|apagado|encender|suspender|suspension|hibernar|arranque|despertar|reposo|pantalla|energia|consola|maquina|ordenador|configuracion|decisiones|actualizar|siempre|nunca|entonces|porque|cuando|desde|hasta|tambien|mientras|deberia|puede|tiene|estado|salida|entrada|fichero|archivo|carpeta|usuario|contrasena|clave|juego|equipo|hogar|casa)\b'''
tags = ["idlectl", "privacy", "language"]

# ---------------------------------------------------------------------------
# Toolchain evidence.  Same rationale as keeping assistant paths out of
# .gitignore: the absence has to be complete to mean anything.
# ---------------------------------------------------------------------------

[[rules]]
id = "idlectl-assistant-tooling-evidence"
description = "assistant/agent tooling path, trailer or marker"
regex = '''(?i)(?:\.claude/|\.cursor(?:rules)?/|\.aider[a-z.]*\b|\.codeium/|\.windsurf(?:rules)?/|\.continue/|\.roo/|\.specstory/|\.opencode/|\.junie/|\.amazonq/|\.kiro/|\.goose/|\.taskmaster/|\bCLAUDE\.md\b|\bAGENTS\.md\b|\bGEMINI\.md\b|\.mcp\.json\b|co-authored-by:\s*(?:claude|copilot|cursor|codex|devin|aider)|generated with \[?(?:claude|codex|cursor|copilot)|anthropic\.com|claude\.ai|copilot-instructions)'''
tags = ["idlectl", "privacy", "toolchain"]
[rules.allowlist]
description = "the scanners that must spell these paths out in order to reject them"
paths = [
  '''(^|/)scripts/check-tracked-paths\.sh$''',
  '''(^|/)scripts/check-commit-identity\.sh$''',
  '''(^|/)scripts/preflight-publish\.sh$''',
  '''(^|/)\.pre-commit-config\.yaml$''',
  '''(^|/)\.github/workflows/leak-scan\.yml$''',
]
