####################################################################################
#  idlectl -- vendor default configuration
#
#  Installed at /usr/lib/idlectl/idlectl.toml.
#
#  DO NOT EDIT THIS FILE. It belongs to the package and is replaced on every upgrade.
#  It is also not an example to copy: it is layer 1 of the configuration the daemon
#  actually reads, so a machine with an empty /etc already has a complete policy.
#
#  To change something, write only what you want to change into either:
#
#      /etc/idlectl/idlectl.toml             (your settings)
#      /etc/idlectl/conf.d/50-something.toml (drop-ins, applied in filename order)
#
#  The three locations are layers, in increasing precedence:
#
#      1  /usr/lib/idlectl/idlectl.toml   this file, owned by the package
#      2  /etc/idlectl/idlectl.toml       yours
#      3  /etc/idlectl/conf.d/*.toml      yours, in ascending byte-wise basename
#                                         order, each later file overriding earlier
#                                         ones -- and all of them overriding layer 2,
#                                         which is the systemd drop-in contract
#
#  The package owns NOTHING under /etc. It never creates those files, never edits
#  them and never removes them, so an upgrade cannot revert a decision you made and
#  uninstalling cannot leave a stale one behind. If they do not exist, this file is
#  the whole configuration.
#
#  Overrides merge key by key, not block by block. Writing
#
#      [while.always]
#      suspend = "45m"
#
#  changes only the suspend timeout of the base schedule; screen_off, hibernate and
#  poweroff keep the values set below.
#
#  There is no syntax for deleting a block. To switch one off, write
#  `enabled = false` into it; to switch a whole detector off, write
#  `[facts.<name>] enabled = false`. Both are reported by `idlectl doctor`, because a
#  silent deletion is indistinguishable from a typo.
#
#  Check your work without restarting anything:   idlectl check-config
####################################################################################


####################################################################################
#  HOW THIS FILE IS READ
#
#  Every block says the same kind of thing:
#
#      while X, turn the screen off after Y, suspend after Z
#
#  Each timeout is turned into an absolute instant first -- its block's clock origin
#  plus the timeout -- and then, for each action SEPARATELY:
#
#      floor(action)     = the LATEST instant among all true [while] blocks that set
#                          a key for that action, plus any implicit floor in force
#      ceiling(action)   = the EARLIEST instant among all true [when] blocks that set
#                          a key for that action
#      resolved(action)  = the EARLIER of the two
#      act when now >= resolved(action)
#
#      never is infinity.
#      Over an empty set, both the latest and the earliest are never.
#      If no block is true, nothing happens. The default is to not act.
#      Order does not matter. There is no priority list. You cannot get it wrong by
#      putting a block in the wrong place, because there is no wrong place.
#
#  A [while] block can only ever push an action LATER; a [when] block can only ever
#  pull it EARLIER. Because the two are combined by taking the earlier instant, a
#  [when] block is the one and only thing in this system that can beat a `never` --
#  see the section on [when] blocks at the bottom of this file.
#
#  Per action SEPARATELY is the part worth pausing on, and so is the word "sets".
#  A block that says nothing about an action contributes NOTHING to it -- not never,
#  nothing. A download must not be interrupted by a suspend, but there is no reason
#  to keep a panel lit for it, so the download block below says `suspend = "never"`
#  and says nothing at all about screen_off. Saying nothing is not saying never.
#
#
#  CLOCKS -- what "after 30 minutes" is counted from
#
#  Each block counts its timeouts from one origin, chosen with `clock =`:
#
#      "human_input"  the last key, click, touch or gamepad input        (default)
#      "resume"       the last wake from suspend or hibernate
#      "condition"    the moment this block's own condition became true
#      "boot"         boot
#
#  This is why "latest wins" is computed over MOMENTS IN TIME, not over durations.
#  A worked example, which is the reason this project exists:
#
#      A machine has been idle for nine hours. It wakes up. Idle counters do not
#      reset across a suspend, so "last human input" still reads nine hours ago.
#
#          [while.always]        suspend = "30m", counted from human input
#          [while.after_resume]  suspend = "5m",  counted from the resume
#
#      Comparing DURATIONS: max(30m, 5m) = 30m, counted from nine hours ago, which
#      is eight and a half hours in the PAST -- the machine suspends about one
#      second after waking. That is a measured incident, not a hypothetical: wake at
#      08:35:45, "SUSPENDING" at 08:35:46, over and over.
#
#      Comparing MOMENTS: max(input+30m, resume+5m) = resume+5m, five minutes from
#      now. Correct, and it stays correct however many blocks are involved, because
#      "the later of two moments" does not care what order you ask in.
#
#  Nothing you write in this file has to think about that. It is written down so
#  that nobody later removes the [while.after_resume] block for looking redundant.
#
#  Clock origins survive a suspend. In particular `clock = "condition"` counts from
#  the moment the condition became true, and a suspend is not a moment at which a
#  condition became true: a wake does not hand a block a fresh timeout. Only the
#  condition going definitely false restarts it.
#
#
#  ONE SLEEP ACTION AT A TIME, AND IT IS THE SHALLOWEST ONE
#
#  screen_off is not a change of the power state, so it may happen in the same
#  evaluation as a sleep action and never suppresses one. Among suspend, hibernate
#  and poweroff, at most one is performed per evaluation, and it is the SHALLOWEST
#  one that is due: suspend before hibernate before poweroff. A deeper action is
#  never a safe substitute for a shallower one.
#
#  The consequence is worth stating plainly rather than discovering: idlectl does
#  not escalate. With `suspend = "30m"` and `poweroff = "8h"` both eventually due,
#  the machine suspends and never powers itself off. If you want escalation, either
#  set `suspend = "never"` and let the deeper action own the schedule, delegate to
#  logind's own suspend-then-hibernate, or ask for the deep action by name with
#  `idlectl rest poweroff`.
#
#
#  WHEN A DETECTOR CANNOT ANSWER
#
#  Every fact has four states, not two: true, false, indeterminate (the detector
#  exists but could not read -- a timeout, a crash, a bad parse) and unavailable
#  (this machine has no such capability at all: no media player, no Steam, no
#  discrete GPU).
#
#      unavailable   behaves exactly like false. A machine without a sound card must
#                    still be allowed to sleep. A capability that is absent reads
#                    unavailable, never indeterminate: that is knowledge, not doubt.
#      indeterminate vetoes suspend, hibernate and poweroff, whether or not any block
#                    below mentions that fact. The rule is about the machine no
#                    longer being able to see something it normally sees, and whether
#                    somebody wrote a block for it is irrelevant to that.
#                    It does NOT veto screen_off -- one flaky sensor must not be able
#                    to keep an OLED panel lit all night.
#
#  Doubt may prevent an action; it may never cause one. A block whose condition is
#  indeterminate is treated as false as a selector, in [while] and [when] alike.
#
#  The way out of a detector that is permanently indeterminate is to switch it off
#  explicitly, in the [facts] section below, where `idlectl doctor` will report it.
#
#  The rule behind all of it: a machine that stays awake wrongly is a cheap error. A
#  machine that sleeps wrongly is not.
####################################################################################


[general]

# How recently a human must have touched an input device for `human_active` to be
# true. This is a presence threshold, not a timeout: it answers "is somebody there",
# not "how long until we act".
min_idle = "5m"


####################################################################################
#  FACTS -- SWITCHING A DETECTOR OFF, AND THE ONE THAT SHIPS OFF
#
#  Every fact can be disabled by name:
#
#      [facts.gpu_busy_other]
#      enabled = false
#
#  A disabled fact reads `unavailable`, its detector never runs, it can never make
#  the machine doubt, and `idlectl doctor` lists it as disabled. This is the
#  supported answer to a detector that is broken on your hardware and is holding the
#  machine awake -- an auditable switch rather than a mystery.
#
#  Blocks that name a disabled fact stay in the file and simply never fire.
####################################################################################

# local_service_busy is the one fact that ships OFF, deliberately.
#
# It answers "has a long-running local service actually served something recently",
# and it can only answer that if it is told where to read cumulative request counters
# from. There is no sensible default for that address, and a detector that ships
# enabled with nothing to read would report `indeterminate` -- which vetoes -- on
# every machine, from the moment the package is installed. That is a wedged machine
# on day one, caused by a feature nobody asked for yet.
#
# To turn it on, write BOTH keys into /etc/idlectl/idlectl.toml (merging is per key,
# so setting only the URL would leave it disabled):
#
#     [facts.local_service_busy]
#     enabled = true
#     counters_url = "http://localhost:8080/metrics"
#     idle_window = "30m"
[facts.local_service_busy]
enabled = false


####################################################################################
#  THE BASE SCHEDULE
####################################################################################

# What happens on a machine that nothing else has an opinion about. Every other
# block in this file exists to hold this one back.
[while.always]
clock = "human_input"

# Ten minutes of no input and the panel goes dark. Cheap to get wrong in both
# directions: a key press brings it straight back, and leaving it lit costs an OLED
# real lifetime.
screen_off = "10m"

# Thirty minutes and the machine suspends to RAM. S3 is the resting state this
# project is built around: it comes back in a handful of seconds, it keeps every
# open window, every ssh session and every half-finished thing exactly where it was,
# and it wakes on a magic packet.
suspend = "30m"

# Hibernation is off by default because it is not free to get wrong: it needs swap
# at least as large as RAM, it needs a resume= kernel argument that matches, and on
# a machine where either is missing it fails in a way that looks like a crash. Turn
# it on deliberately, or delegate escalation to logind's own suspend-then-hibernate,
# which idlectl does not fight.
hibernate = "never"

# POWEROFF IS NEVER, AND CHANGING THIS DESERVES A MOMENT'S THOUGHT.
#
# On the machine this policy was extracted from, an unattended poweroff hung roughly
# one time in four: the shutdown started, something never finished, and the box sat
# there drawing power with no display output and no network, until somebody walked
# over and held the button down. A machine you have to revive by hand is worse than
# a machine that stayed awake -- and remote wake, the whole reason you would power
# off in the first place, is exactly what a hung shutdown takes away from you.
#
# Suspend, on the same hardware over the same period, resumed reliably in seconds.
#
# So the default is: rest, do not stop. If you turn this on, be sure you can get
# back in physically, and see idlectl.toml(5) before you do.
#
# Note also that idlectl does not escalate: turning this on does NOT give you
# "suspend at 30m, then power off at 8h". The shallowest due action wins, so the
# machine would suspend at 30m and the poweroff deadline would never be reached
# while it slept.
poweroff = "never"


####################################################################################
#  EVERY BLOCK BELOW RESTATES hibernate AND poweroff AS never
#
#  Even though the base schedule already says never for both, and even where it
#  looks redundant. These blocks are read by people deciding what to change, and a
#  reader who turns poweroff (or hibernate) on in [while.always] -- the single most
#  likely edit anyone makes to this file -- should not also have to work out which
#  other blocks needed updating. Restating them here makes the safe answer survive
#  that edit: no game, no film, no download and nobody's remote session gets ended
#  by a change made somewhere else in the file.
####################################################################################


####################################################################################
#  THE FLOOR: SOMEBODY IS AT THE MACHINE
####################################################################################

# Human presence is a first-class fact, not merely the clock the base schedule is
# counted on. If it were only a clock, nothing would stop a remote request, a relay
# or a script from suspending a machine somebody is actively typing on -- the
# request would simply arrive and be honoured, because no rule said otherwise.
#
# This block is that rule. While somebody is there, `never` wins the comparison
# outright and only an explicit, logged `idlectl rest --force` can beat it.
#
# Two edge cases, both deliberate:
#   - never touched since boot  -> false, not indeterminate. A machine woken by a
#     magic packet that has never seen a keypress demonstrably has nobody at it, and
#     this is what keeps the wake-use-rest cycle working for a remote relay.
#   - idle source unreadable    -> indeterminate. The detector did not observe a
#     human, so it must not claim it did; reporting an observation that was not made
#     turns doubt into knowledge. The machine still stays awake, because doubt about
#     any enabled fact vetoes suspend, hibernate and poweroff on its own, without
#     needing this block. The difference is diagnostic and it matters: `idlectl
#     doctor` can then say "the agent is dead" instead of "somebody is at the
#     machine", and exits non-zero saying it.
[while.human_active]
suspend = "never"
hibernate = "never"
poweroff = "never"

# Note what is NOT here: screen_off.
#
# The base schedule already counts screen_off from the last human input, so a person
# at the keyboard keeps the panel lit without this block saying anything. Adding
# `screen_off = "never"` here would buy nothing and would cost something real: if the
# idle detector ever failed, `human_active` would read indeterminate, and while doubt
# does not veto screen_off it would leave a lit panel with nothing counting down
# against it. Silence is the safer instruction.


####################################################################################
#  THE SETTLE WINDOW AFTER A WAKE
####################################################################################

# The block the worked example at the top is about. Without it, a machine that wakes
# up carrying hours of accumulated idle is instantly past its suspend deadline and
# goes straight back to sleep.
#
# `clock = "resume"` is what makes it work: five minutes counted from the wake, not
# from whenever somebody last touched a key. Once those five minutes pass the block
# stops mattering all by itself -- its moment recedes into the past and the latest of
# the two is the base schedule again. Nothing has to switch it off.
#
# All three sleep actions are covered, not just suspend, so that the settle window
# still exists on a machine where the administrator enabled hibernate.
#
# It is also the second half of the answer to "why not just use the desktop's own
# auto-suspend timer". That timer was measured NOT to re-arm after a resume: the
# machine woke up and nothing was counting any more. One owner of the power state,
# with an explicit rule for what a wake means, is the entire point.
[while.after_resume]
clock = "resume"
suspend = "5m"
hibernate = "5m"
poweroff = "5m"

# Note what is deliberately NOT here: screen_off.
#
# A wake is not evidence that anybody is in the room. Most wakes on this kind of
# machine are magic packets sent by something else -- a relay, a backup job, a
# scheduled build. The desktop daemon this project replaced counted its screen-off
# timer from the RESUME, so a 3 AM relay wake relit the panel and left it lit for
# fifteen minutes with nobody there. Giving this block a screen_off key would
# reintroduce exactly that, in miniature, on every remote wake.
#
# The base schedule already owns the panel, counted from the last human input, which
# on a headless wake is correctly still hours ago: the screen stays dark until
# somebody touches something.


####################################################################################
#  SOMEBODY IS USING THE MACHINE FROM SOMEWHERE ELSE
####################################################################################

# An open remote session means somebody is working, and they cannot press a key on
# the machine's own keyboard to prove it. Suspending under them drops the connection
# and, if this is the only way in, strands the work.
#
# `never` looks aggressive. It is the right default anyway: a forgotten ssh session
# holding a machine awake costs electricity, and a suspend in the middle of a build
# costs the build. Cheap error versus expensive one.
#
# If you would rather cap it, the commented block below suspends eight hours after
# the session opened. Read the clock carefully before you use it -- "condition"
# counts from when the session STARTED, not from the last thing you typed in it, so
# a genuinely long working session will be cut off. A lease is the better tool:
#
#     idlectl lease acquire nightly-build --ttl 6h --why "training run"
[while.remote_session]
suspend = "never"
hibernate = "never"
poweroff = "never"

# [while.remote_session]
# clock = "condition"
# suspend = "8h"


####################################################################################
#  A JOB SAID IT IS WORKING
####################################################################################

# A lease is the explicit, honest way to say "do not sleep, I am busy" -- the thing
# to reach for before a long job rather than hoping a detector notices.
#
# It carries a time to live and it is tied to the handle that took it, so a job that
# crashes cannot pin a machine awake forever. That matters: the failure mode of every
# "hold this open" mechanism is the holder dying without cleaning up.
[while.lease_held]
suspend = "never"
hibernate = "never"
poweroff = "never"


####################################################################################
#  SOMETHING IS PLAYING
####################################################################################

# MPRIS. Suspending mid-film is the most visible possible failure, and blanking the
# panel during one is nearly as bad, so the panel is held for as long as playback
# lasts.
#
# Suspend gets two hours rather than `never`, counted from the last human input.
# Playback is the classic thing that is left running after everybody has left the
# room: a paused-then-resumed queue, a browser tab, a player that never stops. Two
# hours after the last keypress is long past the end of any film somebody is
# actually watching, and a machine holding twelve gigabytes of VRAM because a player
# was left open all weekend is the failure this project was written to remove. If
# you are doing something genuinely longer, take a lease.
#
# On a machine with no media player at all this fact reads `unavailable`, which
# behaves as false, so this block simply never applies. It costs nothing to ship.
[while.media_playing]
clock = "human_input"
screen_off = "never"
suspend = "2h"
hibernate = "never"
poweroff = "never"


####################################################################################
#  STEAM
####################################################################################

# A game is running. Not "Steam is open" -- a game.
#
# screen_off is `never` here and that is deliberate: a running game is exactly the
# state in which the panel is in use even though nobody is touching a keyboard, and
# this fact extinguishes itself the moment the game exits, so the panel is held by a
# condition that ends rather than by an infinity nobody can see.
#
# suspend is two hours from the last human input, NOT `never`. "I fell asleep with
# the game running" is the case this number exists for: a paused game holding the
# GPU all night is not a machine in use. Two hours is far longer than any gap in
# actual play and short enough that the machine rests before morning.
[while.steam_game_running]
clock = "human_input"
screen_off = "never"
suspend = "2h"
hibernate = "never"
poweroff = "never"

# A download or a content verification is in flight.
#
# This block is the clearest argument in this file for why idlectl exists at all.
# Steam declares NO logind inhibitor while downloading. With a 150 GB download
# actually running, the only inhibitor locks present on the system were
# NetworkManager's and UPower's -- both mode `delay`, neither about downloads -- plus
# a power-key handler. Anything built on inhibitors is structurally blind to this. It
# does not see the download slowly, or partially: it does not see it.
#
# `never` is safe here in a way it would not be elsewhere, because the fact
# extinguishes itself: it is true only while files under the staging tree are still
# being written, so a finished or abandoned download stops holding the machine
# within minutes, without a timeout having to guess.
#
# Note also what this block does NOT say: screen_off. A download has no opinion about
# your panel, and there is no reason to burn one for six hours to fetch a game.
[while.steam_downloading]
suspend = "never"
hibernate = "never"
poweroff = "never"


####################################################################################
#  THE GPU IS BUSY -- BUT BUSY DOING WHAT
####################################################################################

# GPU load attributable to a running game, by process ancestry. Belt and braces
# alongside [while.steam_game_running]: a game launched outside Steam, or one whose
# process tree the Steam detector loses track of, still shows up here -- and it gets
# the same answer, for the same reasons.
[while.gpu_busy_game]
clock = "human_input"
screen_off = "never"
suspend = "2h"
hibernate = "never"
poweroff = "never"

# GPU load that is NOT attributable to a game, deliberately split out and deliberately
# given a timeout instead of `never`.
#
# A compositor keeping a GPU at eight per cent is not a reason to keep a machine awake
# until somebody notices. Twenty minutes counted from when the load appeared
# (`clock = "condition"`, not from the last keypress) gives a real workload time to
# announce itself through a lease and gives background noise a way to expire. That
# twenty minutes is counted once, from when the load appeared, and a wake does not
# restart it.
[while.gpu_busy_other]
clock = "condition"
suspend = "20m"
hibernate = "never"
poweroff = "never"


####################################################################################
#  A LOCAL SERVICE IS ACTUALLY BEING USED
####################################################################################

# Read the name twice: BUSY, not RUNNING. That distinction was paid for.
#
# A local model server can sit up all night holding twelve gigabytes of VRAM and
# serving nothing at all. "The service is running" describes a process that exists;
# it does not describe a machine that is in use, and treating the two as the same
# thing means the machine never sleeps again from the day you install it.
#
# So there is deliberately NO block here on "the service is up". This fact is fed by
# cumulative request counters, and it is true only if those counters actually moved
# recently. A service that is idle is not activity, however much memory it is holding.
#
# This block does nothing until the fact is turned on and given a counters endpoint;
# see the [facts.local_service_busy] section near the top of this file.
[while.local_service_busy]
suspend = "never"
hibernate = "never"
poweroff = "never"


####################################################################################
#  LOGIND INHIBITOR LOCKS -- A SIGNAL WE CHOOSE TO HONOUR
####################################################################################

# When some other program takes a `block` inhibitor against sleep, it usually has a
# reason, so honouring it is polite and cheap.
#
# But it is read as a HINT, never relied on as a guarantee, for two measured reasons.
# First, `systemctl poweroff` invoked without a controlling terminal returns success
# and ignores inhibitors and open sessions entirely -- so nothing can be built on the
# assumption that a lock will stop anything. Second, the things you most want to be
# protected from do not take locks at all: see the Steam download note above.
#
# Mode `delay` locks are deliberately NOT reported into this fact. NetworkManager and
# UPower hold them permanently on an ordinary desktop, so honouring those would mean
# never sleeping again, which is indistinguishable from having no policy at all.
[while.inhibitor_block]
suspend = "never"
hibernate = "never"
poweroff = "never"


####################################################################################
#  [when] BLOCKS -- FORCING, NOT HOLDING BACK
#
#  Everything above is a `[while]` block: a reason to WAIT, and the latest deadline
#  wins.
#
#  A `[when]` block is the opposite -- a deadline by which something MUST happen. The
#  two are combined by taking the EARLIER instant, so a `[when]` block can only ever
#  make an action happen sooner, never later, and it is the only thing in the system
#  that can beat a `never`. That includes [while.human_active], the veto that doubt
#  raises when a detector cannot answer, and the veto raised by a broken
#  configuration file. There is exactly one override channel here and this is it.
#
#  There are none enabled by default, and adding one should feel like a decision. It
#  is treated as one: every [when] block in the effective configuration is logged at
#  warning level when the configuration is loaded, naming the file it came from, is
#  listed by `idlectl doctor` as a standing hazard, and when it fires the log record
#  names it, its file, and every floor it defeated together with each floor's reason.
#  A ceiling that quietly did nothing and reported success would be worse than no
#  ceiling at all.
#
#  Two things that are easy to confuse, and are not the same:
#
#    idlectl rest --now      Treats exactly two blocks as satisfied -- the one whose
#                            condition is `always` and the one whose condition is
#                            `after_resume` -- even where their value is `never`, and
#                            NOTHING ELSE. A running game, an active download, a held
#                            lease and an open remote session are all still
#                            evaluated, each on its own clock, and so are the implicit
#                            vetoes raised by doubt and by a bad configuration. The
#                            set is fixed by condition name; no key in this file can
#                            enlarge it. This is what a remote relay sends when it has
#                            finished with a machine, and it must never be able to
#                            suspend one that is in the middle of something.
#
#    idlectl rest --force    Installs a [when] ceiling due immediately, for that one
#                            request. Because ceilings are absolute, it defeats every
#                            floor there is: `never`, human presence, the doubt veto
#                            of an unreadable detector and the veto of a rejected
#                            configuration file. That last pair is what it is usually
#                            reached for -- a machine wedged awake by something that
#                            is broken rather than by something that is happening.
#                            Separately named, separately authorised through polkit,
#                            and always logged with a reason and with the list of
#                            floors it defeated.
#
#                            It overrides POLICY, never MECHANISM: one transition at a
#                            time still holds, a refusal from logind is still logged
#                            and not retried blindly, and the facts are still re-read
#                            immediately before acting.
#
#  If --now could collapse condition blocks there would be no difference between the
#  two, and a relay tidying up after itself would suspend a machine mid-game. That is
#  a regression against the shipped system this policy was extracted from, so the two
#  stay separate.
#
#  Example of an explicit forcing rule -- left commented, and note that it would
#  suspend a machine somebody is actively typing on:
#
#    [when.lease_held]
#    clock = "condition"
#    suspend = "12h"     # no lease may hold this machine awake longer than half a day
####################################################################################
