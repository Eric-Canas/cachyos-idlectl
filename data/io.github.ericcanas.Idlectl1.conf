<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  D-Bus system bus policy for idlepolicyd.

  Installed at /usr/share/dbus-1/system.d/, which is the vendor location. The
  administrator location is /etc/dbus-1/system.d/, and the package owns nothing
  there, so a local policy override is never touched by an upgrade.

  On the namespace: `io.github.ericcanas` is lower-case and hyphen-free on purpose,
  and permanently. The D-Bus specification restricts the elements of an interface
  name to [A-Za-z0-9_], so the forge handle `Eric-Canas` cannot appear literally.
  This spelling is load-bearing in four places at once (this filename, the polkit
  action ids, the introspection XML and every client), so it cannot be prettied up
  later.

  Division of labour, which matters for reading the rules below: this file decides
  who may SEND a message at all; polkit decides who may make it DO something. Sending
  is allowed broadly and deliberately, because the read-only calls (Status, Explain,
  Doctor) are how a user finds out why their machine will not sleep, and needing
  authentication to ask a diagnostic question is how people stop asking. Everything
  that changes state is checked by polkit inside the daemon, against the caller's
  real session and uid; see io.github.ericcanas.Idlectl1.policy.
-->
<busconfig>

  <!-- Only root may be idlepolicyd. -->
  <policy user="root">
    <allow own="io.github.ericcanas.Idlectl1"/>
  </policy>

  <policy context="default">
    <!-- Standard introspection and property access. -->
    <allow send_destination="io.github.ericcanas.Idlectl1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.ericcanas.Idlectl1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.ericcanas.Idlectl1"
           send_interface="org.freedesktop.DBus.Peer"/>

    <!--
      The manager interface. Every state-changing method on it is polkit-checked by
      the daemon; the read-only ones are not, so that "why is this machine awake?" is
      always answerable by whoever is standing in front of it.
    -->
    <allow send_destination="io.github.ericcanas.Idlectl1"
           send_interface="io.github.ericcanas.Idlectl1.Manager"/>
  </policy>

  <!--
    THE AGENT INTERFACE, AND THE ONE THING THE AGENT IS ALLOWED TO COMMAND.

    Blanking a display is not a power transition and logind cannot do it: on a Wayland
    session only the compositor, or whatever holds DRM master, can turn an output off.
    So the session agent exposes Blank/Unblank on this interface and the daemon calls
    them. It is the single exception to "the agent reports facts and never acts", and
    it is deliberately a narrow one: the agent can command nothing but the screen,
    only inside its own session, and only when the caller is root.

    The agent owns no well-known name here. It connects to the system bus, registers
    with the daemon, and the daemon calls back on its unique connection name, which
    is why there is no <allow own=""/> rule for any user below, and why an ordinary
    user cannot squat this interface by claiming a name.

    The rules are therefore about who may SEND on the interface. Only root may, and
    root is only ever idlepolicyd, because that is who runs it.
  -->
  <policy user="root">
    <allow send_interface="io.github.ericcanas.Idlectl1.Agent"/>
  </policy>

  <policy context="default">
    <deny send_interface="io.github.ericcanas.Idlectl1.Agent"/>
  </policy>

</busconfig>
